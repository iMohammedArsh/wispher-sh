<!-- Full-colour Hams icon for macOS before 26 and for Windows.
     macOS grid: 824×824 body inset 100 px, continuous-corner radius ≈ 185. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B07C"/>
      <stop offset="1" stop-color="#1B5A3F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F4EC"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2A1D" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <g fill="url(#bar)" filter="url(#drop)">
    <rect x="252" y="252" width="92" height="520" rx="46"/>
    <rect x="371" y="402" width="76" height="220" rx="38"/>
    <rect x="474" y="352" width="76" height="320" rx="38"/>
    <rect x="577" y="402" width="76" height="220" rx="38"/>
    <rect x="680" y="252" width="92" height="520" rx="46"/>
  </g>
</svg>
