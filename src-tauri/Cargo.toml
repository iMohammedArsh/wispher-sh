[package]
name = "hams"
version = "0.2.0"
description = "Fast, private voice typing for macOS and Windows"
authors = ["Mohammed Arsh"]
edition = "2021"

[lib]
name = "hams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-stt"]
# In-process whisper.cpp. Disable to type-check without a C++ toolchain.
local-stt = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
dirs = "5"
cpal = "0.15"
rubato = "0.16"
arboard = "3"
regex = "1"
whisper-rs = { version = "0.15", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15", optional = true, features = ["metal"] }
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSWindow", "NSResponder"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# whisper.cpp is unusably slow unoptimized; optimize it (and the DSP) even in dev builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
