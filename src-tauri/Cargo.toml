[package]
name = "hams"
version = "0.2.0"
description = "Fast, private voice typing for macOS and Windows"
authors = ["Mohammed Arsh"]
edition = "2021"

[lib]
name = "hams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-stt"]
# In-process whisper.cpp. Disable to type-check without a C++ toolchain.
local-stt = ["hams-core/local-stt"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hams-core = { path = "../crates/hams-core", default-features = false }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
dirs = "5"
cpal = "0.15"
arboard = "3"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Keychain existence checks that read attributes only, so macOS never prompts.
security-framework = "3"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSWindow", "NSResponder"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hams-core = { path = "../crates/hams-core", default-features = false, features = ["specta"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-serde = "=0.0.15"
specta-typescript = "=0.0.15"
specta-util = "=0.0.15"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
