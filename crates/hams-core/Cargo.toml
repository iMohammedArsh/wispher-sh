[package]
name = "hams-core"
version = "0.2.0"
description = "The Hams dictation engine: record → transcribe → clean up → polish → deliver → persist. Platform-neutral; used by the desktop app and the mobile apps."
authors = ["Mohammed Arsh"]
edition = "2021"

[features]
default = ["local-stt"]
# In-process whisper.cpp. Disable to type-check without a C++ toolchain.
local-stt = ["dep:whisper-rs"]
# Derive specta::Type on the types the desktop frontend receives (bindings.ts).
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
rubato = "0.16"
regex = "1"
whisper-rs = { version = "0.15", optional = true }
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
whisper-rs = { version = "0.15", optional = true, features = ["metal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
