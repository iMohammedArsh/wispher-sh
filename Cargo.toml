[workspace]
resolver = "2"
members = ["src-tauri", "crates/hams-core", "crates/hams-mobile"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# whisper.cpp is unusably slow unoptimized; optimize it (and the DSP) even in dev builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
